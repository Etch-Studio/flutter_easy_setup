name: easy_setup
description: A CLI tool that automates Flutter project flavor setup and CI/CD pipeline generation from a single YAML config.
version: 0.1.0-dev.3
repository: https://github.com/lwbvv/flutter_easy_setup.git

environment:
  sdk: ^3.10.8

# Add regular dependencies here.
dependencies:
  args: ^2.7.0 # For parsing CLI arguments (e.g., --flavor dev)
  yaml: ^3.1.3 # For reading the user's YAML configuration
  path: ^1.9.0
  image: ^4.5.0 # App icon resizing

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6

executables:
  easy_setup: easy_setup  # Run bin/easy_setup.dart as the 'easy_setup' command
